[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xbe-sidecar"
version = "0.1.0"
description = "Linux companion launcher for XboxXBERecomp Windows releases"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xbe-sidecar = "xbe_sidecar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
